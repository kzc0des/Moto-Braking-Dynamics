<ng-content />

<div
  #panel
  popover="manual"
  role="tooltip"
  class="floating-panel w-[440px] max-w-[calc(100vw-16px)] p-3 rounded-xl border border-[var(--kerb)] bg-[var(--tooltip)] text-[var(--ink-2)] shadow-xl pointer-events-none"
>
  <div class="flex items-center justify-between gap-2 mb-2">
    <span class="text-xs font-bold text-[var(--ink)]">{{ info().title }}</span>
    <span class="text-[10px] font-mono font-semibold uppercase tracking-wider px-1.5 py-0.5 rounded bg-[var(--line-tint)] text-[var(--line-deep)] border border-[var(--line)]/60">
      {{ info().position }}
    </span>
  </div>

  <!-- width/height reserve the box before the image loads, so the panel is positioned at its final size -->
  <img
    [src]="info().image.src"
    [width]="info().image.width"
    [height]="info().image.height"
    [alt]="'Labelled photo: ' + info().title"
    class="block w-full h-auto max-h-[340px] object-contain rounded-lg border border-[var(--kerb)] bg-[var(--well)]"
  />

  <p class="mt-2 mb-0 text-[11.5px] leading-relaxed">{{ info().description }}</p>
  <p class="mt-1.5 mb-0 text-[11px] leading-snug">
    <span class="font-semibold text-[var(--ink)]">Common on:</span> {{ info().commonOn }}
  </p>
</div>
