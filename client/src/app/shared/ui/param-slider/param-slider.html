<div class="flex flex-col gap-1.5 py-1.5">
  <div class="flex items-center justify-between text-sm">
    <label class="font-semibold text-[var(--ink)] flex items-center gap-1.5 text-xs sm:text-sm">
      <span>{{ label() }}</span>
      @if (symbol()) {
        <span class="text-xs text-[var(--ink-2)]">({{ symbol() }})</span>
      }
    </label>
    <div class="flex items-center gap-1.5">
      <input
        type="number"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [ngModel]="value()"
        (ngModelChange)="onInputChange($event)"
        class="w-20 px-2 py-1 text-right text-xs sm:text-sm bg-white border rounded-md text-[var(--ink)] tabular-nums focus:outline-none focus:border-[var(--line)]"
        [ngClass]="isOutOfBounds() ? 'border-[var(--danger)] text-[var(--danger)]' : 'border-[var(--kerb)]'"
      />
      <span class="text-xs text-[var(--ink-2)] min-w-7">{{ unit() }}</span>
    </div>
  </div>

  <input
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="value()"
    (input)="onSliderInput($event)"
    class="road-slider w-full h-1.5 bg-[var(--well)] rounded-lg appearance-none cursor-pointer accent-[var(--line)] transition-colors"
  />

  @if (description()) {
    <p class="text-xs text-[var(--ink-2)] leading-normal">{{ description() }}</p>
  }
</div>
