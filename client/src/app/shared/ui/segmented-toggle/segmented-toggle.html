<div class="flex p-0.5 bg-[var(--well)] border border-[var(--kerb)] rounded-lg">
  @for (opt of options(); track opt.value) {
    <button
      type="button"
      (click)="selectOption(opt.value)"
      class="flex-1 px-3 py-1.5 text-xs font-semibold rounded-md transition-colors text-center cursor-pointer"
      [ngClass]="
        value() === opt.value
          ? 'bg-[var(--surface)] text-[var(--ink)] font-bold shadow-2xs border border-[var(--kerb)]'
          : 'text-[var(--ink-2)] hover:text-[var(--ink)]'
      "
    >
      {{ opt.label }}
    </button>
  }
</div>
