<div class="flex flex-col gap-1">
  <div class="flex items-center justify-between text-xs font-mono text-[var(--ink-2)]">
    <span class="truncate font-semibold">{{ label() }}</span>
    <span class="text-[var(--ink)] font-bold tabular-nums">{{ (slipRatio() * 100).toFixed(1) }}%</span>
  </div>
  <div class="grid grid-cols-10 gap-1 p-1 bg-[var(--well)] border border-[var(--kerb)] rounded-md">
    @for (seg of segments(); track $index) {
      <div
        class="h-2 rounded-[2px] transition-colors duration-75"
        [ngClass]="seg.active ? seg.color : 'bg-[var(--kerb)]'"
      ></div>
    }
  </div>
</div>
