<div class="flex flex-col gap-3 p-4 bg-white border border-[var(--kerb)] rounded-xl shadow-xs select-none">
  <!-- Benchmark Instance Selector Badges -->
  <div class="flex items-center gap-2.5 border-b border-[var(--kerb)] pb-3 overflow-x-auto no-scrollbar">
    @for (inst of store.instances(); track inst.id) {
      <button
        type="button"
        class="flex items-center gap-2 px-3.5 py-1.5 text-xs rounded-lg border cursor-pointer transition-all select-none"
        [ngClass]="
          store.selectedInstanceId() === inst.id
            ? 'bg-[var(--line-tint)] border-[var(--line)] shadow-2xs font-bold text-[var(--ink)]'
            : 'bg-white border-[var(--kerb)] hover:border-[var(--ink-2)] font-medium text-[var(--ink-2)]'
        "
        (click)="store.setSelectedInstanceId(inst.id)"
      >
        <!-- Color indicator dot -->
        <span
          class="w-2.5 h-2.5 rounded-full shrink-0"
          [style.backgroundColor]="inst.colorAccent"
        ></span>

        <!-- Instance Name -->
        <span class="truncate">
          {{ inst.name }}
        </span>
      </button>
    }
  </div>

  <!-- Pillar Selector Tabs -->
  <div class="flex items-center gap-3 border-b border-[var(--kerb)] pb-1 text-xs font-semibold">
    <button
      type="button"
      (click)="activePillar.set('chassis')"
      class="px-2 py-1.5 transition-colors border-b-2 cursor-pointer"
      [ngClass]="activePillar() === 'chassis' ? 'border-[var(--line)] text-[var(--ink)] font-bold' : 'border-transparent text-[var(--ink-2)] hover:text-[var(--ink)]'"
    >
      1. Chassis & Geometry
    </button>
    <button
      type="button"
      (click)="activePillar.set('roadway')"
      class="px-2 py-1.5 transition-colors border-b-2 cursor-pointer"
      [ngClass]="activePillar() === 'roadway' ? 'border-[var(--line)] text-[var(--ink)] font-bold' : 'border-transparent text-[var(--ink-2)] hover:text-[var(--ink)]'"
    >
      2. Roadway & Environment
    </button>
    <button
      type="button"
      (click)="activePillar.set('actuation')"
      class="px-2 py-1.5 transition-colors border-b-2 cursor-pointer"
      [ngClass]="activePillar() === 'actuation' ? 'border-[var(--line)] text-[var(--ink)] font-bold' : 'border-transparent text-[var(--ink-2)] hover:text-[var(--ink)]'"
    >
      3. Actuation & Scenario
    </button>
  </div>

  <!-- Active Pillar Panel -->
  <div class="mt-1">
    @switch (activePillar()) {
      @case ('chassis') {
        <app-chassis-panel />
      }
      @case ('roadway') {
        <app-roadway-panel />
      }
      @case ('actuation') {
        <app-actuation-panel />
      }
    }
  </div>
</div>
