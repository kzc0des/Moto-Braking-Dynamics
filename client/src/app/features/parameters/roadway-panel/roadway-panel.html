<div class="flex flex-col gap-3 py-1">
  <!-- Surface Substrate -->
  <div class="flex flex-col gap-1.5">
    <label class="text-xs sm:text-sm font-semibold text-[var(--ink)]">Surface Substrate</label>
    <app-segmented-toggle
      [options]="substrateOptions"
      [value]="env().substrate"
      (valueChange)="store.updateEnvironmentParam('substrate', $event)"
    />
  </div>

  <!-- Surface Contaminant -->
  <div class="flex flex-col gap-1.5">
    <label class="text-xs sm:text-sm font-semibold text-[var(--ink)]">Surface Contaminant</label>
    <app-segmented-toggle
      [options]="contaminantOptions"
      [value]="env().contaminant"
      (valueChange)="store.updateEnvironmentParam('contaminant', $event)"
    />
  </div>

  <!-- Road Grade Incline Angle -->
  <app-param-slider
    label="Road Grade Angle (Incline)"
    symbol="θ"
    unit="rad"
    [min]="-0.20"
    [max]="0.20"
    [step]="0.01"
    [value]="env().roadGradeAngle"
    description="Longitudinal slope (>0 uphill, <0 downhill)"
    (valueChange)="store.updateEnvironmentParam('roadGradeAngle', $event)"
  />

  <!-- Pothole Void Defect Toggle -->
  <div class="flex items-center justify-between p-3 bg-[var(--concrete)] border border-[var(--kerb)] rounded-lg text-sm">
    <div>
      <span class="font-semibold text-[var(--ink)] text-xs sm:text-sm">Pothole Disturbance</span>
      <p class="text-xs text-[var(--ink-2)]">Simulates normal load reduction at x = 15m</p>
    </div>
    <button
      type="button"
      (click)="togglePothole()"
      class="px-3 py-1 text-xs font-semibold rounded-md border transition-colors cursor-pointer"
      [ngClass]="env().potholeEnabled ? 'bg-[#FDF0EF] text-[#9E241E] border-[#D93A32]/40 font-bold' : 'bg-white text-[var(--ink-2)] border-[var(--kerb)]'"
    >
      {{ env().potholeEnabled ? 'ACTIVE' : 'OFF' }}
    </button>
  </div>
</div>
