<div class="flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-1 bg-white select-none overflow-x-auto min-w-0 shrink-0 h-10">
  <!-- 1. Play / Pause / Replay Button -->
  <button
    type="button"
    (click)="handlePlay()"
    class="px-3.5 py-1.5 font-bold rounded-lg transition-colors cursor-pointer text-xs sm:text-sm flex items-center gap-1.5 shadow-2xs shrink-0 bg-[var(--line)] hover:bg-[var(--line-hover)] text-[var(--ink)]"
    [title]="store.isPlaying() ? 'Pause playback' : (isAtEnd() ? 'Replay simulation from start' : 'Play simulation trajectory')"
  >
    @if (store.isPlaying()) {
      <svg class="w-3.5 h-3.5 fill-current shrink-0" viewBox="0 0 24 24">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
      </svg>
      <span>Pause</span>
    } @else if (isAtEnd()) {
      <svg class="w-3.5 h-3.5 stroke-current shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span>Replay</span>
    } @else {
      <svg class="w-3.5 h-3.5 fill-current shrink-0" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
      <span>Play</span>
    }
  </button>

  <!-- 2. Dedicated Reset Button -->
  <button
    type="button"
    (click)="store.resetPlayback()"
    class="px-2.5 py-1.5 bg-white hover:bg-[var(--concrete)] text-[var(--ink)] font-semibold rounded-lg border border-[var(--kerb)] flex items-center gap-1.5 transition-colors cursor-pointer text-xs shrink-0 shadow-2xs"
    title="Reset playback to start line (t = 0.00s)"
  >
    <svg class="w-3 h-3 stroke-current shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
      <path d="M3 3v5h5" />
    </svg>
    <span>Reset</span>
  </button>

  <!-- 3. Scrub Time Readout -->
  <div class="flex items-center gap-1.5 min-w-32 text-xs sm:text-sm shrink-0 font-mono tabular-nums">
    <span class="font-bold text-[var(--ink)]">{{ store.scrubTime().toFixed(2) }} s</span>
    <span class="text-[var(--ink-3)]">/</span>
    <span class="text-[var(--ink-2)]">{{ store.maxRunTime().toFixed(2) }} s</span>
  </div>

  <!-- 4. Scrubber Range Slider with dynamic progress track fill -->
  <input
    type="range"
    min="0"
    [max]="store.maxRunTime()"
    step="0.01"
    [value]="store.scrubTime()"
    (input)="onScrubInput($event)"
    class="road-slider flex-1 h-2 cursor-pointer min-w-32"
    [style.--track-bg]="trackBackground()"
    title="Scrub simulation trajectory"
  />

  <!-- 5. Speed Multiplier Pills (0.5x, 1x, 2x) -->
  <div class="flex items-center border border-[var(--kerb)] rounded-lg p-0.5 bg-[var(--well)] shrink-0">
    @for (speed of [0.5, 1.0, 2.0]; track speed) {
      <button
        type="button"
        (click)="store.setPlaybackSpeed(speed)"
        class="px-2 py-1 text-xs rounded-md transition-colors cursor-pointer font-medium"
        [ngClass]="
          store.playbackSpeed() === speed
            ? 'bg-white text-[var(--ink)] font-bold shadow-2xs border border-[var(--kerb)]'
            : 'text-[var(--ink-2)] hover:text-[var(--ink)]'"
      >
        {{ speed === 1.0 ? '1x' : (speed === 2.0 ? '2x' : '0.5x') }}
      </button>
    }
  </div>

  <!-- 6. Live Auto-compute Toggle -->
  <button
    type="button"
    (click)="store.toggleAutoCompute()"
    class="px-2.5 py-1.5 text-xs rounded-lg border font-bold transition-all cursor-pointer flex items-center gap-1.5 shrink-0"
    [ngClass]="
      store.autoCompute()
        ? 'bg-[#EAF7EE] text-[#156939] border-[#1F9D55]/40 shadow-2xs'
        : 'bg-white text-[var(--ink-2)] border-[var(--kerb)] hover:text-[var(--ink)]'
    "
    title="Toggle automatic recomputation on parameter change"
  >
    <span class="w-1.5 h-1.5 rounded-full" [ngClass]="store.autoCompute() ? 'bg-[#1F9D55]' : 'bg-[var(--ink-3)]'"></span>
    <span>{{ store.autoCompute() ? 'LIVE' : 'MANUAL' }}</span>
  </button>
</div>
